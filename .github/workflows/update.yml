name: Update Lydia Loop Analytics Dashboard

on:
  push:
    branches: [ main ]
  schedule:
    # Runs every 2 hours at minute 17 (bypasses top-of-the-hour GitHub queue congestion)
    - cron: '17 */2 * * *'
  workflow_dispatch:
    inputs:
      trigger_source:
        description: 'Source of manual trigger'
        required: false
        default: 'web-dashboard'
  repository_dispatch:
    types: [ rerun-pipeline, manual-trigger ]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout Dashboard Repository
        uses: actions/checkout@v4

      - name: Checkout Canonical Solver Engine (NightscoutAdvisorKit)
        uses: actions/checkout@v4
        with:
          repository: userseven8/NightscoutAdvisor
          path: vendor/NightscoutAdvisor

      - name: Cache Compiled NightscoutAdvisorKit CLI
        uses: actions/cache@v4
        with:
          path: vendor/NightscoutAdvisor/Packages/NightscoutAdvisorKit/.build
          key: advisor-cli-macos15-${{ hashFiles('vendor/NightscoutAdvisor/Packages/NightscoutAdvisorKit/Package.swift', 'vendor/NightscoutAdvisor/Packages/NightscoutAdvisorKit/Sources/**/*.swift') }}
          restore-keys: |
            advisor-cli-macos15-

      - name: Generate Analytics Dashboard via NightscoutAdvisorKit
        env:
          ADVISOR_KIT_PATH: ${{ github.workspace }}/vendor/NightscoutAdvisor/Packages/NightscoutAdvisorKit
        run: |
          python3 generate_dashboard.py

      - name: Commit and Push Updated Dashboard
        continue-on-error: true
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add index.html
          if ! git diff --staged --quiet; then
            git commit -m "Automated 2-hour pipeline run: NightscoutAdvisorKit sync [skip ci]"
            git push origin main || true
          fi

      - name: Stage Clean Site Directory for GitHub Pages
        run: |
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='vendor' --exclude='_site' ./ _site/

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
